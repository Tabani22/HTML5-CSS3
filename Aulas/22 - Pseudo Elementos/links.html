<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            font-weight: bolder;
            text-decoration: none;
        }

        a:visited {
            color: rgb(94, 0, 0);
            font-weight: lighter;
        }

        a:hover {
            text-decoration: underline;
        }

        a:active {
            color: darkorange;
        }

        .especial::after {
            content: ' <---';
            text-decoration: none;
            color: grey;
            font-weight: normal;
        }

        .especial::before {
            content: '---> ';
            text-decoration: none;
            color: grey;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="https://github.com/Tabani22" class="especial">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/c/CursoemVídeo">Canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com">Site do CursoEmVídeo</a></li>
        <li><a href="https://www.instagram.com/gustavo.tabani/">Instagram</a></li>
    </ul>
</body>
</html>
