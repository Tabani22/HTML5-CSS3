<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário HTML5</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome:</label>
                <input style="width: 23vh;" type="nome" id="inome" name="nome" autocomplete="nome" required>
            </p>
            <p>
                <label for="iemail">E-mail:</label>
                <input style="width: 23vh;" type="email" id="iemail" name="email" autocomplete="email" required>
            </p>
            <p>
                <label for="itel">Telefone:</label>
                <input style="width: 23vh;" type="tel" id="itel" name="tel" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" placeholder="Formato esperado: (99)99999-9999" required>
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
    </form>
</body>
</html>
