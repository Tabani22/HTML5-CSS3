<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <form for="iano">Em que ano você nasceu? </form>
            <input type="number" name="ano" id="iano" min="1900" max="2026" value="2000" required oninput="calcIdade()">
        </p>

        <p>
            <label for="iidade">Idade: </label>
            <output id="iidade" name="idade">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <script>  
    function calcIdade() {
        var ano = document.getElementById('iano').value;
        var idade = new Date().getFullYear() - ano;
        document.getElementById('iidade').value = idade;
    }
    </script>
</body>
</html>
