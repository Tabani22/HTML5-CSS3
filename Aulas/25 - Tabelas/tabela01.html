<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(255, 96, 96);
        }

        main {
            background-color: rgb(255, 255, 255);
            width: 800px;
            padding: 20px 0px 50px 0px;
            border-radius: 20px;
            box-shadow: 0px 0px 5px 5px rgba(0, 0, 0, 0.148);

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
        }

        main h1 {
            padding: 10px 0px 15px 0px;
            text-align: center;
        }

        table {
            width: 400px;
            border-collapse: collapse;
            font-weight: bolder;
            margin: auto;
        }

        td {
            border: 1px solid black;
            padding: 8px;
        }

        .linhaImpar {
            background-color: rgb(189, 189, 189);
        }
        
        .linhaPar {
            background-color: rgb(232, 232, 232);
        }
        </style>
</head>
<body>
    <main>
    <h1>Minha primeira tabela</h1>
    <!-- HIERARQUIA DE TABELAS (simples)
    TABLE = tabela
        TABLE ROW = linha de tabela
            TABLE HEADER = cabeçalho de tabela 
            TABLE DATA = dado de tabela -->

    <table>
        <tr class="linhaImpar">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linhaPar">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr class="linhaImpar">
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr class="linhaPar">
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
    </main>
</body>
</html>
