<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        .cimpar {
            background-color: rgb(196, 196, 196);
        }

        .cpar {
            background-color: rgb(216, 216, 216);
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>

    <table>
        <colgroup>
            <col class="cimpar">
            <col class="cpar">
            <col class="cimpar">
            <col class="cpar">
        </colgroup>
        <caption>Cadastro</caption>
    <tr>
        <th scope="col">Nome</th>
        <th scope="col">Sexo</th>
        <th scope="col">Idade</th>
        <th scope="col">Profissão</th>
    </tr>
    <tr>
        <td>Ana Maria</td>
        <td>F</td>
        <td>25</td>
        <td>Jornalista</td>
    </tr>
    <tr>
        <td>Gustavo</td>
        <td>M</td>
        <td>24</td>
        <td>Desenvolvedor Front-End</td>
    </tr>
    <tr>
        <td>Claudio</td>
        <td>M</td>
        <td>27</td>
        <td>Bombeiro</td>
    </tr>
    <tr>
        <td>Fernanda</td>
        <td>F</td>
        <td>29</td>
        <td>Médica</td>
    </tr>
    <tr>
        <td>Otávio</td>
        <td>M</td>
        <td>23</td>
        <td>Nutricionista</td>
    </tr>
    </table>
</body>
</html>
